version: "3.9"

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: taskforge
      POSTGRES_PASSWORD: taskforge
      POSTGRES_DB: taskforge
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskforge"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql://taskforge:taskforge@db:5432/taskforge
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - file_storage:/app/storage

  worker_high:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: celery -A app.tasks worker -Q high_priority -l info --hostname=worker_high@%h
    environment:
      DATABASE_URL: postgresql://taskforge:taskforge@db:5432/taskforge
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - file_storage:/app/storage

  worker_low:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: celery -A app.tasks worker -Q high_priority,low_priority -l info --hostname=worker_low@%h
    environment:
      DATABASE_URL: postgresql://taskforge:taskforge@db:5432/taskforge
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - file_storage:/app/storage

  flower:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: celery -A app.tasks flower --port=5555
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  file_storage: